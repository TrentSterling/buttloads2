name: Cave material checks
on:
  push:
    branches: [codex/cave-geology-20261017]
permissions:
  contents: read
concurrency:
  group: cave-material-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare reports
        run: mkdir -p cave-reports
      - name: Pure system suite (no browser or input)
        shell: bash
        run: |
          set -o pipefail
          node tools/test.mjs 2>&1 | tee cave-reports/system-tests.txt
      - name: Build standalone game
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node tools/build.mjs 2>&1 | tee cave-reports/build.txt
          git rev-parse HEAD > cave-reports/source-commit.txt
          sha256sum dist/index.html > cave-reports/build-sha256.txt
      - name: Install isolated Chromium verification tools
        if: always()
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Actual offline game render checks (no input or pointer lock)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          git show a98d15a0bfb25f8d4a17d4351ba6260f4d335d23:src/beauty.js > cave-reports/baseline-beauty.js
          node tools/test-cave-browser.mjs 2>&1 | tee cave-reports/browser-tests.txt
      - name: Save validation reports and playable build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buttloads2-cave-validation
          path: |
            cave-reports/
            dist/index.html
            LICENSE
            THIRD_PARTY.md
          retention-days: 3
          if-no-files-found: error
