name: Cave material checks
on:
  push:
    branches: [codex/cave-geology-20261017]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'vendor/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/cave-material-checks.yml'
permissions:
  contents: read
concurrency:
  group: cave-material-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  systems:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare clean-checkout report directories
        run: mkdir -p cave-reports tools/out
      - name: Pure system suite (no browser or input)
        shell: bash
        run: |
          set -o pipefail
          node tools/test.mjs 2>&1 | tee cave-reports/system-tests.txt
      - name: R4 mineral field and art contracts
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node tools/test-cave-art.mjs 2>&1 | tee cave-reports/cave-art-tests.txt
          git rev-parse HEAD > cave-reports/source-commit.txt
      - name: Save system reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buttloads2-cave-systems
          path: cave-reports/
          retention-days: 3
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build complete standalone game
        shell: bash
        run: |
          set -o pipefail
          mkdir -p cave-reports tools/out
          node tools/build.mjs 2>&1 | tee cave-reports/build.txt
          git rev-parse HEAD > cave-reports/source-commit.txt
          sha256sum dist/index.html > cave-reports/build-sha256.txt
          git show a28fa21085ddcf30e9d7f77cec74fd99e3657b2b:src/beauty.js > cave-reports/baseline-beauty.js
      - name: Install isolated Chromium verification tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Prepare nonshipping shadow isolation cases
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          let s=fs.readFileSync('tools/test-cave-browser.mjs','utf8');
          function replace(a,b){assert.equal(s.split(a).length,2,a);s=s.replace(a,b);}
          replace("['no-shadow-map','no-density','no-mineral','no-clearcoat']","['no-shadow-map','no-density','no-mineral','no-clearcoat','front-shadow','double-shadow','zero-normal-bias','force-shadow-refresh','no-chunk-culling']");
          replace('v.terrainMaterial.clearcoat=old.coat;',`v.terrainMaterial.shadowSide=null;v.headlamp.shadow.normalBias=.018;v.headlamp.shadow.needsUpdate=true;v.renderer.shadowMap.needsUpdate=true;for(const m of v.terrain.children)m.frustumCulled=true;v.terrainMaterial.clearcoat=old.coat;`);
          replace("if(mode==='no-clearcoat')",`if(mode==='front-shadow')v.terrainMaterial.shadowSide=THREE.FrontSide;
              if(mode==='double-shadow')v.terrainMaterial.shadowSide=THREE.DoubleSide;
              if(mode==='zero-normal-bias')v.headlamp.shadow.normalBias=0;
              if(mode==='force-shadow-refresh'){v.headlamp.shadow.autoUpdate=true;v.renderer.shadowMap.autoUpdate=true;}
              if(mode==='no-chunk-culling')for(const m of v.terrain.children)m.frustumCulled=false;
              if(mode==='no-clearcoat')`);
          fs.writeFileSync('tools/.test-cave-debug.mjs',s);
          fs.writeFileSync('cave-reports/executed-browser-harness.mjs',s);
          JS
      - name: Actual offline game renders (no input or pointer lock)
        shell: bash
        run: |
          set -o pipefail
          node tools/.test-cave-debug.mjs 2>&1 | tee cave-reports/browser-tests.txt
      - name: Save native renders and playable build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buttloads2-cave-native
          path: |
            cave-reports/
            dist/index.html
            LICENSE
            THIRD_PARTY.md
          retention-days: 3
          if-no-files-found: error
