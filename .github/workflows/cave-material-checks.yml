name: Cave material checks
on:
  push:
    branches: [codex/cave-geology-20261017]
  pull_request:
    paths:
      - 'src/beauty.js'
      - 'tools/test-cave*.mjs'
      - 'tools/test-beauty.mjs'
      - '.github/workflows/cave-material-checks.yml'
permissions:
  contents: read
concurrency:
  group: cave-material-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare reports
        run: mkdir -p cave-reports
      - name: Pure system suite (no browser or input)
        shell: bash
        run: |
          set -o pipefail
          node tools/test.mjs 2>&1 | tee cave-reports/system-tests.txt
      - name: Build standalone game
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node tools/build.mjs 2>&1 | tee cave-reports/build.txt
          git rev-parse HEAD > cave-reports/source-commit.txt
          sha256sum dist/index.html > cave-reports/build-sha256.txt
      - name: Save validation reports and playable build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buttloads2-cave-validation
          path: |
            cave-reports/
            dist/index.html
            LICENSE
            THIRD_PARTY.md
          retention-days: 3
          if-no-files-found: error
