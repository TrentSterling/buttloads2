name: Cave material checks
on:
  workflow_dispatch:
  push:
    branches: [codex/cave-geology-20261017]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'vendor/**'
      - 'index.html'
      - 'package*.json'
# Workflow-only maintenance does not rerun the unchanged 20-minute game suite.
# Use the manual trigger to verify future workflow edits themselves.
permissions:
  contents: read
concurrency:
  group: cave-material-${{ github.ref }}
  cancel-in-progress: true
jobs:
  systems:
    runs-on: ubuntu-latest
    # The complete suite takes about 20 minutes on the hosted runner; reserve
    # time for the separate art checks, report upload, and Actions cleanup.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare clean-checkout report directories
        run: mkdir -p cave-reports tools/out
      - name: Pure system suite (no browser or input)
        shell: bash
        run: |
          set -o pipefail
          node tools/test.mjs 2>&1 | tee cave-reports/system-tests.txt
      - name: R4 mineral field and art contracts
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node tools/test-cave-art.mjs 2>&1 | tee cave-reports/cave-art-tests.txt
          git rev-parse HEAD > cave-reports/source-commit.txt
      - name: Save system reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buttloads2-cave-systems
          path: cave-reports/
          retention-days: 3
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build complete standalone game
        shell: bash
        run: |
          set -o pipefail
          mkdir -p cave-reports tools/out
          node tools/build.mjs 2>&1 | tee cave-reports/build.txt
          git rev-parse HEAD > cave-reports/source-commit.txt
          sha256sum dist/index.html > cave-reports/build-sha256.txt
          git show a28fa21085ddcf30e9d7f77cec74fd99e3657b2b:src/beauty.js > cave-reports/baseline-beauty.js
      - name: Install isolated Chromium verification tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Actual offline game renders (no input or pointer lock)
        shell: bash
        run: |
          set -o pipefail
          node tools/test-cave-browser.mjs 2>&1 | tee cave-reports/browser-tests.txt
      - name: Save native renders and playable build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buttloads2-cave-native
          path: |
            cave-reports/
            dist/index.html
            LICENSE
            THIRD_PARTY.md
          retention-days: 3
          if-no-files-found: error
